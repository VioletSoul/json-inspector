function studioIcons(){for(const[id,key]of Object.entries({open:'open',sample:'sample',download:'download',copyAll:'copy',headerCompare:'compare',densityToggle:'density',focusMode:'focus',toggleStats:'stats',pinInspector:'pin',parentNode:'parent',inspectPathCopy:'path',copyValue:'copy'}))studioIcon($(id),key);}
function studioState(){const tag=$('stateTag');let key='studioEmpty',value='empty';if(jobs.size){key='studioBusy';value='busy';}else if(S.error){key='studioError';value='error';}else if(draft()){key='studioDraft';value='draft';}else if(S.doc){key='studioApplied';value='applied';}tag.textContent=t(key);tag.dataset.state=value;$('copyAll').disabled=!$('source').value.length;$('download').disabled=!$('source').value.length;}
const stateBeforeStudio=state;state=function(){stateBeforeStudio();studioState();};
function welcomeScreen(){const host=$('tree');host.replaceChildren();const wrap=el('div','welcome');const logo=el('div','welcome-logo','{ }');logo.setAttribute('aria-hidden','true');wrap.append(logo,el('div','welcome-eyebrow',t('welcomeEyebrow')),el('h1','',t('welcomeTitle')),el('p','',t('welcomeText')));const actions=el('div','welcome-actions');const open=el('button','primary',t('welcomeOpen'));open.onclick=()=>$('open').click();studioIcon(open,'open');const sample=el('button','',t('welcomeSample'));sample.onclick=()=>$('sample').click();studioIcon(sample,'sample');actions.append(open,sample);const paste=el('button','welcome-link',t('welcomePaste'));paste.onclick=()=>{view('sourcePanel');$('source').focus();};wrap.append(actions,paste,el('div','welcome-privacy',t('welcomePrivacy')));host.append(wrap);}
const treeBeforeStudio=renderTree;renderTree=function(focusId=null){treeBeforeStudio(focusId);if(!S.doc)welcomeScreen();};
function studioChips(){const host=$('filterChips');if(host.hidden)return;const mapping=new Map([[t('inKeys'),'sKeys'],[t('inValues'),'sValues'],[t('inPaths'),'sPaths'],[t('exactMatch'),'sExact'],[t('caseSensitive'),'sCase']]);for(const span of [...host.querySelectorAll('span.chip')]){const name=span.textContent,button=el('button','chip',name+' ×');button.setAttribute('aria-label',t('removeFilter',{name}));button.onclick=()=>{const id=mapping.get(name);if(id)$(id).checked=false;else $('sType').value='';updateSearch();};span.replaceWith(button);}}
const searchBeforeStudio=updateSearch;updateSearch=function(reset=true){searchBeforeStudio(reset);studioChips();};
function studioDensityText(){const compact=document.body.classList.contains('compact');$('densityToggle').textContent=t(compact?'comfortableDensity':'compactDensity');$('densityToggle').setAttribute('aria-pressed',String(compact));studioIcon($('densityToggle'),'density');}
const translateBeforeStudio=translate;translate=function(){translateBeforeStudio();studioIcons();studioDensityText();studioState();};
$('headerCompare').onclick=()=>{if(!S.doc){notify('openFirst');return;}view('diffPanel');$('file2').click();};
$('densityToggle').onclick=()=>{document.body.classList.toggle('compact');studioDensityText();};
const resizeHandle=$('inspectorResizer'),workspace=$('studioWorkspace');
function inspectorWidth(){return Math.round($('inspectorDock').getBoundingClientRect().width);}
function setInspectorWidth(width){const max=Math.max(280,Math.min(600,workspace.clientWidth-390));width=Math.max(280,Math.min(max,width));workspace.style.setProperty('--inspector-width',width+'px');resizeHandle.setAttribute('aria-valuenow',Math.round(width));resizeHandle.setAttribute('aria-valuemax',Math.round(max));}
resizeHandle.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();resizeHandle.setPointerCapture(e.pointerId);const start=e.clientX,width=inspectorWidth();document.body.style.cursor='col-resize';document.body.style.userSelect='none';const move=event=>setInspectorWidth(width+start-event.clientX);const end=()=>{resizeHandle.removeEventListener('pointermove',move);resizeHandle.removeEventListener('pointerup',end);resizeHandle.removeEventListener('pointercancel',end);document.body.style.cursor='';document.body.style.userSelect='';};resizeHandle.addEventListener('pointermove',move);resizeHandle.addEventListener('pointerup',end);resizeHandle.addEventListener('pointercancel',end);};
resizeHandle.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?40:10;setInspectorWidth(e.key==='Home'?280:e.key==='End'?600:inspectorWidth()+(e.key==='ArrowLeft'?step:-step));};
window.addEventListener('resize',()=>{if(innerWidth>960&&workspace.style.getPropertyValue('--inspector-width'))setInspectorWidth(inspectorWidth());});

view('treePanel');translate();renderDiff();requestAnimationFrame(()=>resizeHandle.setAttribute('aria-valuenow',inspectorWidth()));

</script></body></html>
