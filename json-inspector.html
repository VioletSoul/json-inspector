function fmt(n){return n.toLocaleString(locale())}

function parseDocument(text){
 let pos=0,pathChars=0;const records=[];
 function fail(key,args={},at=pos){const before=text.slice(0,at);throw new AppError(key,args,at,before.split('\n').length,at-before.lastIndexOf('\n'))}

let drag=0;const hasFiles=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');window.addEventListener('dragenter',e=>{if(hasFiles(e)){e.preventDefault();drag++;$('overlay').style.display='grid'}});window.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});window.addEventListener('dragleave',e=>{if(hasFiles(e)&&--drag<=0){drag=0;$('overlay').style.display='none'}});window.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();drag=0;$('overlay').style.display='none';openFile(e.dataTransfer.files[0])});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeInspector()});window.addEventListener('beforeunload',e=>{if(pending()){e.preventDefault();e.returnValue=''}});
for(const id of ['treePrev','treeNext','tablePrev','tableNext','hitPrev','hitNext'])$(id).disabled=true;
translateInterface();renderTree();
